<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - SMALLBOXCLOUD Herbania</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 36px 40px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .login-logo {
            height: 56px;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .login-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }
        .login-subtitle {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            transform: translateY(-1px);
        }
        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 18px;
            text-align: left;
        }
        .login-footer {
            margin-top: 22px;
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/logo_herbania.png" alt="Herbania" class="login-logo">
        <h1 class="login-title">SMALLBOXCLOUD</h1>
        <p class="login-subtitle">Control de Caja Chica & Arqueos Digitales</p>

        {% if error %}
        <div class="login-error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form id="loginForm" action="/login" method="POST">
            <div class="form-group">
                <label class="form-label" for="delegacion">Delegación / Sede</label>
                <select id="delegacion" name="delegacion" class="form-input" style="cursor: pointer;">
                    <option value="arinaga">🏢 Central Arinaga</option>
                    <option value="lanzarote">📦 Delegación Lanzarote</option>
                    <option value="fuerteventura">❄️ Delegación Fuerteventura</option>
                    <option value="prueba">🧪 Delegación Prueba (Admin)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Correo Corporativo</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="usuario@herbania.es" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #94a3b8; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="rememberMe" name="remember" checked style="accent-color: #0284c7; width: 15px; height: 15px; cursor: pointer;">
                    Recordar acceso rápido
                </label>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
            Congelados Herbania, S.A. &copy; 2026<br>
            <span style="color: #38bdf8; font-weight: 600;">Desarrollado por CAIC</span>
        </div>
    </div>

    <script>
        // Restaurar datos guardados para acceso rápido
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('sbc_email');
            const savedDelegacion = localStorage.getItem('sbc_delegacion');
            const savedPass = localStorage.getItem('sbc_pass');

            const emailInput = document.getElementById('email');
            const delegacionSelect = document.getElementById('delegacion');
            const passInput = document.getElementById('password');
            const rememberCheck = document.getElementById('rememberMe');

            if (savedEmail) {
                emailInput.value = savedEmail;
                if (savedDelegacion) delegacionSelect.value = savedDelegacion;
                if (savedPass) passInput.value = savedPass;
                // Si ya hay datos, enfocar el botón o contraseña
                if (savedPass) {
                    document.querySelector('.btn-submit').focus();
                } else {
                    passInput.focus();
                }
            } else {
                emailInput.focus();
            }

            // Guardar al enviar si está marcado
            document.getElementById('loginForm').addEventListener('submit', () => {
                if (rememberCheck.checked) {
                    localStorage.setItem('sbc_email', emailInput.value);
                    localStorage.setItem('sbc_delegacion', delegacionSelect.value);
                    localStorage.setItem('sbc_pass', passInput.value);
                } else {
                    localStorage.removeItem('sbc_email');
                    localStorage.removeItem('sbc_delegacion');
                    localStorage.removeItem('sbc_pass');
                }
            });
        });
    </script>
</body>
</html>
